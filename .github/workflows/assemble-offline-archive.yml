name: Assemble offline archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restore original files and assemble verified archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git clone --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          python3 .github/archive_tools/build_offline_archive.py
